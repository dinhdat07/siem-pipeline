services:
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.1.2}
    container_name: kafka
    hostname: kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.17.3}
    container_name: elasticsearch
    hostname: elasticsearch
    profiles: ["hot"]
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  kibana:
    image: ${KIBANA_IMAGE:-docker.elastic.co/kibana/kibana:8.17.3}
    container_name: kibana
    hostname: kibana
    profiles: ["hot"]
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_PUBLICBASEURL: http://localhost:${KIBANA_PORT:-5601}
    depends_on:
      elasticsearch:
        condition: service_started

  connect:
    build:
      context: .
      dockerfile: docker/connect/Dockerfile
    container_name: connect
    hostname: connect
    profiles: ["hot"]
    ports:
      - "${KAFKA_CONNECT_PORT:-8083}:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_INTERNAL:-kafka:29092}
      CONNECT_GROUP_ID: siem-connect
      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_PARTITIONS: 3
      CONNECT_STATUS_STORAGE_PARTITIONS: 3
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_INTERNAL_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_REST_PORT: 8083
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      CONNECT_LOG4J_ROOT_LOGLEVEL: INFO
      CONNECT_LOG4J_LOGGERS: org.apache.kafka.connect.runtime.rest=WARN,org.reflections=ERROR
      KAFKA_HEAP_OPTS: ${KAFKA_CONNECT_HEAP_OPTS:--Xms256m -Xmx256m}
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_started

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    container_name: minio
    hostname: minio
    profiles: ["cold"]
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
      MINIO_DOMAIN: minio
      MINIO_REGION_NAME: ${MINIO_REGION:-us-east-1}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      default:
        aliases:
          - warehouse.minio

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-04-16T18-13-26Z}
    container_name: minio-init
    profiles: ["cold"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >-
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-admin} ${MINIO_ROOT_PASSWORD:-password}) do echo '...waiting for minio...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing local/${MINIO_WAREHOUSE_BUCKET:-warehouse};
      "

  iceberg-rest:
    image: ${ICEBERG_REST_IMAGE:-apache/iceberg-rest-fixture:1.10.1}
    container_name: iceberg-rest
    hostname: iceberg-rest
    profiles: ["cold"]
    ports:
      - "${ICEBERG_REST_PORT:-8181}:8181"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_REGION: ${MINIO_REGION:-us-east-1}
      CATALOG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-s3://warehouse/}
      CATALOG_CATALOG__IMPL: ${ICEBERG_CATALOG_IMPL:-org.apache.iceberg.jdbc.JdbcCatalog}
      CATALOG_URI: ${ICEBERG_CATALOG_JDBC_URI:-jdbc:sqlite:/tmp/iceberg_catalog.db}
      CATALOG_JDBC_USER: ${ICEBERG_CATALOG_JDBC_USER:-user}
      CATALOG_JDBC_PASSWORD: ${ICEBERG_CATALOG_JDBC_PASSWORD:-password}
      CATALOG_JDBC_STRICT__MODE: ${ICEBERG_CATALOG_JDBC_STRICT_MODE:-true}
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: ${S3_ENDPOINT_INTERNAL:-http://minio:9000}
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_S3_ACCESS__KEY__ID: ${MINIO_ROOT_USER:-admin}
      CATALOG_S3_SECRET__ACCESS__KEY: ${MINIO_ROOT_PASSWORD:-password}
    volumes:
      - iceberg_catalog_data:/tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/v1/config"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  flink-jobmanager:
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
      args:
        FLINK_BASE_IMAGE: ${FLINK_BASE_IMAGE:-flink:1.19.2-scala_2.12-java17}
        FLINK_SQL_KAFKA_CONNECTOR_VERSION: ${FLINK_SQL_KAFKA_CONNECTOR_VERSION:-3.2.0-1.19}
        ICEBERG_FLINK_RUNTIME_VERSION: ${ICEBERG_FLINK_RUNTIME_VERSION:-1.19}
        ICEBERG_VERSION: ${ICEBERG_VERSION:-1.10.1}
        HADOOP_VERSION: ${HADOOP_VERSION:-3.4.2}
    container_name: flink-jobmanager
    hostname: flink-jobmanager
    profiles: ["cold", "detect"]
    command: jobmanager
    ports:
      - "${FLINK_UI_PORT:-8081}:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.port: 8081
        jobmanager.memory.process.size: ${FLINK_JOBMANAGER_MEMORY:-512m}
        taskmanager.numberOfTaskSlots: ${FLINK_TASK_SLOTS:-4}
        parallelism.default: ${FLINK_PARALLELISM:-1}
      AWS_REGION: ${MINIO_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password}
      S3_ENDPOINT: ${S3_ENDPOINT_INTERNAL:-http://minio:9000}
    volumes:
      - ./flink/sql:/opt/flink/sql
      - ./flink/usrlib:/opt/flink/usrlib
    depends_on:
      kafka:
        condition: service_healthy

  flink-taskmanager:
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
      args:
        FLINK_BASE_IMAGE: ${FLINK_BASE_IMAGE:-flink:1.19.2-scala_2.12-java17}
        FLINK_SQL_KAFKA_CONNECTOR_VERSION: ${FLINK_SQL_KAFKA_CONNECTOR_VERSION:-3.2.0-1.19}
        ICEBERG_FLINK_RUNTIME_VERSION: ${ICEBERG_FLINK_RUNTIME_VERSION:-1.19}
        ICEBERG_VERSION: ${ICEBERG_VERSION:-1.10.1}
        HADOOP_VERSION: ${HADOOP_VERSION:-3.4.2}
    container_name: flink-taskmanager
    hostname: flink-taskmanager
    profiles: ["cold", "detect"]
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: ${FLINK_TASKMANAGER_MEMORY:-768m}
        taskmanager.numberOfTaskSlots: ${FLINK_TASK_SLOTS:-4}
        parallelism.default: ${FLINK_PARALLELISM:-1}
      AWS_REGION: ${MINIO_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password}
      S3_ENDPOINT: ${S3_ENDPOINT_INTERNAL:-http://minio:9000}
    depends_on:
      flink-jobmanager:
        condition: service_started
    volumes:
      - ./flink/sql:/opt/flink/sql
      - ./flink/usrlib:/opt/flink/usrlib

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: postgres
    hostname: postgres
    profiles: ["benchmark"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-siem_benchmark}
      POSTGRES_USER: ${POSTGRES_USER:-siem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siem}
    command: ["postgres", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./benchmark/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-siem} -d ${POSTGRES_DB:-siem_benchmark}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  kafka_data:
  elasticsearch_data:
  minio_data:
  iceberg_catalog_data:
  postgres_data:
